<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142b46">
  <meta name="description" content="남성주·황성욱(2013) 제주 해군기지 위기 커뮤니케이션 연구 발제. 웹페이지와 트위터의 이미지 회복 전략 및 소구유형 비교. 조민성.">
  <title>제주 해군기지 · 이미지 회복 전략 비교 | 조민성</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="assets/anime.min.js"></script>
  <script defer src="content.js"></script>
  <script defer src="slides.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#stage">슬라이드로 이동</a>
  <main id="viewport" aria-label="논문 발제 슬라이드">
    <div id="stage" tabindex="-1"></div>
  </main>
  <nav class="toolbar" aria-label="발표 도구">
    <button id="contents" aria-label="목차 열기 (G)">목차 <kbd>G</kbd></button>
    <span class="tool-divider"></span>
    <button id="prev" aria-label="이전 슬라이드">←</button>
    <span id="counter" aria-live="polite">01 / 15</span>
    <button id="next" aria-label="다음 슬라이드">→</button>
    <span class="tool-divider"></span>
    <button id="notes">발표 노트 <kbd>N</kbd></button>
    <button id="data">원자료·출처 <kbd>D</kbd></button>
    <button id="fullscreen" aria-label="전체 화면 (F)">전체 화면 <kbd>F</kbd></button>
    <button id="help" aria-label="사용법">?</button>
  </nav>
  <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
  <dialog id="panel" aria-labelledby="panel-title">
    <header><h2 id="panel-title"></h2><button id="close-panel" aria-label="패널 닫기">닫기 ×</button></header>
    <div id="panel-body"></div>
  </dialog>
  <noscript>이 발표 자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
</body>
</html>
